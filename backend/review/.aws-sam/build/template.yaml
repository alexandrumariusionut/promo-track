AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Promo Track - Review System API
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
    - arm64
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME:
          Ref: ReviewsTable
Resources:
  ReviewApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
        - https://promo-track.harmony.a2z.com
        - https://promo-track.beta.harmony.a2z.com
        - http://localhost:5173
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
      Auth:
        DefaultAuthorizer: MidwayAuth
        Authorizers:
          MidwayAuth:
            FunctionArn:
              Fn::GetAtt:
              - MidwayAuthorizerFunction
              - Arn
            FunctionInvokeRole:
              Fn::GetAtt:
              - MidwayAuthorizerRole
              - Arn
            Identity:
              Headers:
              - Authorization
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: false
  MidwayAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - authorizer.mjs
        External:
        - '@aws-sdk/*'
        Format: esm
        Minify: false
        OutExtension:
        - .js=.mjs
        Target: es2022
      SamResourceId: MidwayAuthorizerFunction
    Properties:
      Handler: authorizer.handler
      CodeUri: MidwayAuthorizerFunction
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          ISSUER: https://midway-auth.amazon.com
          JWKS_URI: https://midway-auth.amazon.com/jwks.json
          AUDIENCES: promo-track.harmony.a2z.com,promo-track.beta.harmony.a2z.com
  MidwayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeAuthorizerLambda
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - MidwayAuthorizerFunction
              - Arn
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: promo-track-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: sessionId
        AttributeType: S
      KeySchema:
      - AttributeName: sessionId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  CreateReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create.handler
      CodeUri: CreateReviewFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ReviewApi
            Path: /reviews
            Method: POST
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReviewsTable
    Metadata:
      SamResourceId: CreateReviewFunction
  GetReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get.handler
      CodeUri: GetReviewFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ReviewApi
            Path: /reviews/{sessionId}
            Method: GET
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - ReviewsTable
            - Arn
    Metadata:
      SamResourceId: GetReviewFunction
  SubmitCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: comments.handler
      CodeUri: SubmitCommentsFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ReviewApi
            Path: /reviews/{sessionId}/comments
            Method: POST
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - ReviewsTable
            - Arn
    Metadata:
      SamResourceId: SubmitCommentsFunction
  CheckStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: status.handler
      CodeUri: CheckStatusFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ReviewApi
            Path: /reviews/{sessionId}/status
            Method: GET
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - ReviewsTable
            - Arn
    Metadata:
      SamResourceId: CheckStatusFunction
Outputs:
  ApiUrl:
    Description: Review API endpoint
    Value:
      Fn::Sub: https://${ReviewApi}.execute-api.${AWS::Region}.amazonaws.com/prod

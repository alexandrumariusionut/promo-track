AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Promo Track - Review System API

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to API health alarms.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref ReviewsTable

Resources:
  ReviewApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "https://promo-track.harmony.a2z.com"
          - "https://promo-track.beta.harmony.a2z.com"
          - "http://localhost:5173"
        AllowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
        AllowHeaders: ["Authorization", "Content-Type"]
      Auth:
        DefaultAuthorizer: MidwayAuth
        Authorizers:
          MidwayAuth:
            FunctionArn: !GetAtt MidwayAuthorizerFunction.Arn
            FunctionInvokeRole: !GetAtt MidwayAuthorizerRole.Arn
            Identity:
              Headers:
                - Authorization
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: false

  MidwayAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - authorizer.mjs
        External:
          - "@aws-sdk/*"
    Properties:
      Handler: authorizer.handler
      CodeUri: src/
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          ISSUER: "https://midway-auth.amazon.com"
          JWKS_URI: "https://midway-auth.amazon.com/jwks.json"
          AUDIENCES: "promo-track.harmony.a2z.com,promo-track.beta.harmony.a2z.com"

  MidwayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeAuthorizerLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MidwayAuthorizerFunction.Arn

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: promo-track-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  CreateReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewApi
            Path: /reviews
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt ReviewsTable.Arn

  GetReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewApi
            Path: /reviews/{sessionId}
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt ReviewsTable.Arn

  SubmitCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: comments.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewApi
            Path: /reviews/{sessionId}/comments
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt ReviewsTable.Arn

  RevokeReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: revoke.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewApi
            Path: /reviews/{sessionId}
            Method: DELETE
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:DeleteItem]
              Resource: !GetAtt ReviewsTable.Arn

  CheckStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: status.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewApi
            Path: /reviews/{sessionId}/status
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt ReviewsTable.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: promo-track-review-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: promo-track-review-5xx
      AlarmDescription: Review API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ReviewApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: Review API endpoint
    Value: !Sub "https://${ReviewApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  AlarmTopicArn:
    Description: SNS topic that receives API health alarms
    Value: !Ref AlarmTopic

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Promo Track - User Data Persistence API

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to API health alarms.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref UsersTable

Resources:
  UserDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "https://promo-track.harmony.a2z.com"
          - "https://promo-track.beta.harmony.a2z.com"
          - "http://localhost:5173"
        AllowMethods: ["GET", "PUT", "OPTIONS"]
        AllowHeaders: ["Authorization", "Content-Type", "If-Match"]
      Auth:
        DefaultAuthorizer: MidwayAuth
        Authorizers:
          MidwayAuth:
            FunctionArn: !GetAtt MidwayAuthorizerFunction.Arn
            FunctionInvokeRole: !GetAtt MidwayAuthorizerRole.Arn
            Identity:
              Headers:
                - Authorization
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: false

  MidwayAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - authorizer.mjs
        External:
          - "@aws-sdk/*"
    Properties:
      Handler: authorizer.handler
      CodeUri: src/
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          ISSUER: "https://midway-auth.amazon.com"
          JWKS_URI: "https://midway-auth.amazon.com/jwks.json"
          AUDIENCES: "promo-track.harmony.a2z.com,promo-track.beta.harmony.a2z.com"

  MidwayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeAuthorizerLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MidwayAuthorizerFunction.Arn

  UsersTable:
    Type: AWS::DynamoDB::Table
    # Portfolio data is the user's only copy once localStorage is cleared —
    # never let a stack delete/replace destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: promo-track-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true

  GetUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /userdata/{userId}
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt UsersTable.Arn

  SaveUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: save.handler
      CodeUri: src/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /userdata/{userId}
            Method: PUT
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt UsersTable.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: promo-track-userdata-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: promo-track-userdata-5xx
      AlarmDescription: User Data API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref UserDataApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: User Data API endpoint
    Value: !Sub "https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  AlarmTopicArn:
    Description: SNS topic that receives API health alarms
    Value: !Ref AlarmTopic

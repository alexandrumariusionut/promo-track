AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Promo Track - User Data Persistence API
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
    - arm64
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME:
          Ref: UsersTable
Resources:
  UserDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
        - https://promo-track.harmony.a2z.com
        - https://promo-track.beta.harmony.a2z.com
        - http://localhost:5173
        AllowMethods:
        - GET
        - PUT
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
      Auth:
        DefaultAuthorizer: MidwayAuth
        Authorizers:
          MidwayAuth:
            FunctionArn:
              Fn::GetAtt:
              - MidwayAuthorizerFunction
              - Arn
            FunctionInvokeRole:
              Fn::GetAtt:
              - MidwayAuthorizerRole
              - Arn
            Identity:
              Headers:
              - Authorization
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: false
  MidwayAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - authorizer.mjs
        External:
        - '@aws-sdk/*'
        Format: esm
        Minify: false
        OutExtension:
        - .js=.mjs
        Target: es2022
      SamResourceId: MidwayAuthorizerFunction
    Properties:
      Handler: authorizer.handler
      CodeUri: MidwayAuthorizerFunction
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          ISSUER: https://midway-auth.amazon.com
          JWKS_URI: https://midway-auth.amazon.com/jwks.json
          AUDIENCES: promo-track.harmony.a2z.com,promo-track.beta.harmony.a2z.com
  MidwayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeAuthorizerLambda
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - MidwayAuthorizerFunction
              - Arn
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: promo-track-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
  GetUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get.handler
      CodeUri: GetUserDataFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: UserDataApi
            Path: /userdata/{userId}
            Method: GET
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - UsersTable
            - Arn
    Metadata:
      SamResourceId: GetUserDataFunction
  SaveUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: save.handler
      CodeUri: SaveUserDataFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: UserDataApi
            Path: /userdata/{userId}
            Method: PUT
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - UsersTable
            - Arn
    Metadata:
      SamResourceId: SaveUserDataFunction
Outputs:
  ApiUrl:
    Description: User Data API endpoint
    Value:
      Fn::Sub: https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com/prod
